apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chessvision-models
  namespace: chessvision
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chessvision-history
  namespace: chessvision
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
