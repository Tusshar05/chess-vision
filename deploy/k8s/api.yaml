apiVersion: apps/v1
kind: Deployment
metadata:
  name: chessvision-api
  namespace: chessvision
  labels: {app: chessvision-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: chessvision-api}
  template:
    metadata:
      labels: {app: chessvision-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/tusshar05/chess-vision-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef: {name: chessvision-config}
          env:
            - name: STOCKFISH_PATH
              value: /usr/games/stockfish
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: history, mountPath: /data}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: chessvision-models}
        - name: history
          persistentVolumeClaim: {claimName: chessvision-history}
---
apiVersion: v1
kind: Service
metadata:
  name: chessvision-api
  namespace: chessvision
spec:
  selector: {app: chessvision-api}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chessvision-api
  namespace: chessvision
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chessvision-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
